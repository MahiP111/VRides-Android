
name: Build V Rides APKs

on:
  workflow_dispatch:
  push:
    paths:
      - "VRides-registration-MVP.zip"
      - ".github/workflows/build-apks.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project from repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Extract V Rides project
        run: unzip -q VRides-registration-MVP.zip

      - name: Build customer and driver APKs
        run: gradle -p VRides-registration-MVP --no-daemon :customer:assembleDebug :driver:assembleDebug

      - name: Save APK files
        uses: actions/upload-artifact@v4
        with:
          name: V-Rides-APK-Files
          path: |
            VRides-registration-MVP/customer/build/outputs/apk/debug/customer-debug.apk
            VRides-registration-MVP/driver/build/outputs/apk/debug/driver-debug.apk
          if-no-files-found: error
          retention-days: 14
